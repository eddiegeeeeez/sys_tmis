name: Deploy Full Stack App to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Publish Backend
        run: |
          cd backend/TradeMatrix.Server

          # Framework-dependent publish targeting .NET 8 on MonsterASP.NET.
          dotnet publish -c Release -o ./publish

          # MonsterASP.NET web root IS the wwwroot folder on FTP.
          # Keep wwwroot intact — deploy its contents into the IIS web root directly.
          # The DLLs and web.config go to wwwroot root, static files go to wwwroot/assets/
          echo "Moving wwwroot contents up to publish root..."
          if [ -d "./publish/wwwroot" ]; then
            cp -r ./publish/wwwroot/. ./publish/
            rm -rf ./publish/wwwroot
          fi

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/TradeMatrix.Server/publish/
          server-dir: /wwwroot/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/logs/*.log
