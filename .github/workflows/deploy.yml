name: Deploy Full Stack App to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Publish Backend
        run: |
          cd backend/TradeMatrix.Server

          # Framework-dependent publish explicitly targeting win-x64.
          # MonsterASP.NET app pool must be set to 64-bit [x64] to match.
          dotnet publish -c Release -o ./publish -r win-x64 --no-self-contained

          # MonsterASP.NET requires frontend assets at the publish root
          # alongside the DLLs so ASP.NET Core owns ALL requests.
          # Without this, IIS serves index.html as a static file and
          # ASP.NET Core never starts, causing every /api/* call to 404.
          echo "Flattening wwwroot into publish root..."
          if [ -d "./publish/wwwroot" ]; then
            cp -r ./publish/wwwroot/. ./publish/
            rm -rf ./publish/wwwroot
          fi

          # Create the logs directory and a placeholder so FTP uploads it
          mkdir -p ./publish/logs
          touch ./publish/logs/.gitkeep

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/TradeMatrix.Server/publish/
          server-dir: /
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/logs/*.log
