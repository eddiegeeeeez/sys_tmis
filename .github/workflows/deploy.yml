name: Deploy Full Stack to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Publish Backend
        run: |
          cd backend/TradeMatrix.Server
          dotnet publish -c Release -o ./publish

      - name: Verify publish artifacts
        run: |
          test -f backend/TradeMatrix.Server/publish/TradeMatrix.Server.dll || { echo "FATAL: DLL not found"; exit 1; }
          test -f backend/TradeMatrix.Server/publish/web.config || { echo "FATAL: web.config not found"; exit 1; }
          test -f backend/TradeMatrix.Server/publish/wwwroot/index.html || { echo "FATAL: Frontend not built into wwwroot"; exit 1; }
          echo "All artifacts verified."

      - name: Inject production secrets into web.config
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          PROD_JWT_KEY: ${{ secrets.PROD_JWT_KEY }}
          PROD_JWT_ISSUER: ${{ secrets.PROD_JWT_ISSUER }}
          PROD_JWT_AUDIENCE: ${{ secrets.PROD_JWT_AUDIENCE }}
          PROD_JWT_EXPIRY_MINUTES: ${{ secrets.PROD_JWT_EXPIRY_MINUTES }}
          PROD_AWS_ACCESS_KEY: ${{ secrets.PROD_AWS_ACCESS_KEY }}
          PROD_AWS_SECRET_KEY: ${{ secrets.PROD_AWS_SECRET_KEY }}
          PROD_AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
          PROD_AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          PROD_AWS_BASE_URL: ${{ secrets.PROD_AWS_BASE_URL }}
        run: |
          python3 << 'PYEOF'
          import os, xml.sax.saxutils as saxutils, sys

          def e(v):
              """XML-escape a secret value so it's safe as an attribute value."""
              return saxutils.escape(v or "", {'"': '&quot;'})

          # Validate required secrets exist
          required = ["PROD_CONNECTION_STRING", "PROD_JWT_KEY", "PROD_JWT_ISSUER", "PROD_JWT_AUDIENCE"]
          missing = [s for s in required if not os.environ.get(s)]
          if missing:
              print(f"FATAL: Missing required secrets: {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)

          new_vars = (
              f'          <environmentVariable name="ConnectionStrings__DefaultConnection" value="{e(os.environ["PROD_CONNECTION_STRING"])}" />\n'
              f'          <environmentVariable name="Jwt__Key" value="{e(os.environ["PROD_JWT_KEY"])}" />\n'
              f'          <environmentVariable name="Jwt__Issuer" value="{e(os.environ["PROD_JWT_ISSUER"])}" />\n'
              f'          <environmentVariable name="Jwt__Audience" value="{e(os.environ["PROD_JWT_AUDIENCE"])}" />\n'
              f'          <environmentVariable name="Jwt__ExpiryMinutes" value="{e(os.environ.get("PROD_JWT_EXPIRY_MINUTES", "60"))}" />\n'
              f'          <environmentVariable name="AWS__S3__AccessKey" value="{e(os.environ.get("PROD_AWS_ACCESS_KEY", ""))}" />\n'
              f'          <environmentVariable name="AWS__S3__SecretKey" value="{e(os.environ.get("PROD_AWS_SECRET_KEY", ""))}" />\n'
              f'          <environmentVariable name="AWS__S3__BucketName" value="{e(os.environ.get("PROD_AWS_BUCKET_NAME", "tradematrix-uploads"))}" />\n'
              f'          <environmentVariable name="AWS__S3__Region" value="{e(os.environ.get("PROD_AWS_REGION", "us-east-1"))}" />\n'
              f'          <environmentVariable name="AWS__S3__BaseUrl" value="{e(os.environ.get("PROD_AWS_BASE_URL", ""))}" />\n'
          )

          path = 'backend/TradeMatrix.Server/publish/web.config'
          with open(path, 'r') as f:
              content = f.read()

          content = content.replace(
              '</environmentVariables>',
              new_vars + '        </environmentVariables>'
          )

          with open(path, 'w') as f:
              f.write(content)

          print("web.config secrets injected successfully.")
          PYEOF

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/TradeMatrix.Server/publish/
          server-dir: /wwwroot/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/logs/*.log
            **/appsettings.Development.json
