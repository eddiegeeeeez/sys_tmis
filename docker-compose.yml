services:
  backend:
    build:
      context: ./backend/TradeMatrix.Server
      dockerfile: Dockerfile
    container_name: tradematrix-backend
    restart: unless-stopped
    ports:
      # Exposing for direct backend testing/development if needed.
      # Production usually only exposes frontend.
      - "5009:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    # Ensure backend starts before frontend if they share a network
    networks:
      - tradematrix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradematrix-frontend
    restart: unless-stopped
    ports:
      # Map host port 80 to container port 80 (Nginx)
      # Map host port 4000 to container port 80 (Nginx)
      - "4000:80"
    depends_on:
      - backend
    networks:
      - tradematrix-net

networks:
  tradematrix-net:
    driver: bridge
